<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error | First Draft</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="error-message">
      <h1>Error Sending Message</h1>
      <p id="error-detail">Please try again later or contact First Draft directly.</p>
      <a href="index.html" class="cta-button">← Back to First Draft</a>
    </div>
    <script>
      // Show specific error if available
      const errorReason = new URLSearchParams(window.location.search).get(
        "reason"
      );
      if (errorReason === "invalid_email") {
        document.getElementById("error-detail").textContent =
          "Please provide a valid email address.";
      } else if (errorReason === "send_failed") {
        document.getElementById("error-detail").innerHTML =
          'Our email server is currently unavailable. Please email First Draft directly at <a href="mailto:contact@firstdraft.com">contact@firstdraft.com</a> or use our alternative email <a href="mailto:firstdraft.agency@gmail.com">firstdraft.agency@gmail.com</a>.';
      } else if (errorReason === "empty_fields") {
        document.getElementById("error-detail").textContent =
          "Please fill in all required fields.";
      }
    </script>
  </body>
</html>
